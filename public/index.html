<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MineBot Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loginScreen">
    <div class="login-card">
      <h1>🤖 MineBot</h1>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password">
      </div>
      <button class="btn" id="loginBtn">Login</button>
      <div class="error-msg" id="loginError">Wrong password!</div>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="sidebar" id="sidebar">
      <h2>⚡ MineBot</h2>
      <ul>
        <li class="active" data-tab="connection"><i>🔌</i> Connection</li>
        <li data-tab="telemetry"><i>📊</i> Telemetry</li>
        <li data-tab="console"><i>💬</i> Console</li>
        <li data-tab="commands"><i>⚙️</i> Commands</li>
      </ul>
    </div>
    <div class="main-content">
      <!-- Connection Tab -->
      <div class="tab-content active" id="tab-connection">
        <div class="card">
          <h3>Server Connection</h3>
          <div class="grid">
            <div class="input-group">
              <label>Server IP</label>
              <input type="text" id="ip" placeholder="Power69.aternos.me">
            </div>
            <div class="input-group">
              <label>Port</label>
              <input type="number" id="port" placeholder="42959">
            </div>
            <div class="input-group">
              <label>Bot Username</label>
              <input type="text" id="name" placeholder="dreamz">
            </div>
            <div class="input-group">
              <label>Version (leave empty for auto)</label>
              <input type="text" id="ver" placeholder="auto">
            </div>
          </div>
          <div style="display:flex;gap:1rem;margin-top:1rem;align-items:center;">
            <label class="offline-label">
              <input type="checkbox" id="offline" checked> Offline mode
            </label>
            <div class="server-status" id="serverStatusContainer">
              <span id="statusDot"></span>
              <span id="statusText">Checking...</span>
              <span id="statusPlayers" style="margin-left:auto;"></span>
            </div>
          </div>
          <div style="display:flex;gap:1rem;margin-top:1rem;">
            <button class="btn connect-btn" id="connectBtn">Connect</button>
            <button class="btn disconnect-btn" id="disconnectBtn" disabled>Disconnect</button>
          </div>
        </div>
      </div>

      <!-- Telemetry Tab -->
      <div class="tab-content" id="tab-telemetry">
        <div class="card">
          <h3>Bot Telemetry</h3>
          <div class="grid" id="telem">
            <div class="stat"><label>Uptime</label><span id="uptime">00:00:00</span></div>
            <div class="stat"><label>Health</label><span id="health">--</span></div>
            <div class="stat"><label>Hunger</label><span id="hunger">--</span></div>
            <div class="stat"><label>Position</label><span id="pos">--</span></div>
            <div class="stat"><label>Ping</label><span id="ping">--</span></div>
            <div class="stat"><label>Inventory</label><span id="inv">--</span></div>
          </div>
          <div class="toggle-container">
            <span>Anti-AFK</span>
            <label class="toggle">
              <input type="checkbox" id="afkToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="card">
          <h3>Server Info</h3>
          <div class="grid" id="serverInfo">
            <div class="stat"><label>Online Players</label><span id="onlinePlayers">--</span></div>
            <div class="stat"><label>Server Brand</label><span id="serverBrand">--</span></div>
            <div class="stat"><label>Version</label><span id="serverVersion">--</span></div>
          </div>
        </div>
        <div class="card">
          <h3>Anti-AFK Log</h3>
          <div class="console-box" id="afkLog"></div>
        </div>
      </div>

      <!-- Console Tab -->
      <div class="tab-content" id="tab-console">
        <div class="card">
          <h3>Server Chat & Output</h3>
          <div class="console-box" id="consoleOut"></div>
          <div class="message-input">
            <input type="text" id="msgInput" placeholder="Type message or command...">
            <button id="sendMsg">Send</button>
          </div>
        </div>
      </div>

      <!-- Commands Tab -->
      <div class="tab-content" id="tab-commands">
        <div class="card">
          <h3>Custom Chat Commands</h3>
          <table class="cmd-list">
            <thead><tr><th>Command</th><th>Response</th><th>Actions</th></tr></thead>
            <tbody id="cmdTable"></tbody>
          </table>
          <div class="add-cmd-form">
            <input type="text" id="newCmd" placeholder="!command">
            <input type="text" id="newResp" placeholder="Response">
            <button class="btn" id="addCmd">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
